services:
  db:
    image: postgres:17-trixie
    env_file: .env                     # логин, пароль и имя базы
    environment:
      # Synapse требует локаль C, иначе не запустится.
      # Применяется только при первом создании базы.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - db-data:/var/lib/postgresql/data   # именованный том, данные переживут пересоздание контейнера
    healthcheck:
      # $$ — переменная раскроется внутри контейнера, а не на этапе чтения compose
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  synapse:
    image: matrixdotorg/synapse:latest
    environment:
      UID: "1000"                      # работать от твоего пользователя, а не от 991
      GID: "1000"
    volumes:
      - ./synapse:/data                # конфиг, ключ и медиа из твоей папки
    ports:
      - "127.0.0.1:8008:8008"          # доступно только с этого компьютера
    depends_on:
      db:
        condition: service_healthy     # стартовать, когда база готова принимать подключения
    restart: unless-stopped

volumes:
  db-data: